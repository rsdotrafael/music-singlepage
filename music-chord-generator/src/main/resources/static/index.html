<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gerador de Escalas Musicais</title>
    <style>
        :root {
            color-scheme: light;
            font-family: system-ui, sans-serif;
            background: #f4f1ea;
            color: #25231f;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
        }

        main {
            width: min(42rem, calc(100% - 2rem));
            box-sizing: border-box;
            padding: 2.5rem;
            border-radius: 1rem;
            background: #fff;
            box-shadow: 0 1rem 3rem rgb(49 43 31 / 12%);
        }

        h1 {
            margin-top: 0;
        }

        form {
            display: flex;
            gap: 0.75rem;
            align-items: end;
            flex-wrap: wrap;
        }

        label {
            display: grid;
            gap: 0.4rem;
            font-weight: 600;
        }

        select,
        button {
            min-height: 2.75rem;
            padding: 0.6rem 0.9rem;
            border: 1px solid #817a6b;
            border-radius: 0.5rem;
            font: inherit;
        }

        button {
            cursor: pointer;
            border-color: #263c2d;
            background: #263c2d;
            color: #fff;
            font-weight: 700;
        }

        #resultado {
            min-height: 2rem;
            margin-top: 2rem;
            font-size: clamp(1.1rem, 4vw, 1.5rem);
            font-weight: 700;
            line-height: 1.6;
        }

        .controles-audio {
            display: flex;
            gap: 0.75rem;
            margin-top: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .configuracoes-som {
            margin-top: 1.5rem;
            padding: 1rem;
            border: 1px solid #d8d2c7;
            border-radius: 0.75rem;
            background: #faf8f3;
        }

        .configuracoes-som legend {
            padding: 0 0.4rem;
            font-weight: 700;
        }

        .opcoes-som {
            display: flex;
            gap: 1.5rem;
            align-items: end;
            flex-wrap: wrap;
        }

        .controle-volume {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            font-weight: 600;
        }

        #volume {
            width: 8rem;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }

        .erro {
            color: #a12222;
        }
    </style>
</head>
<body>
<main>
    <h1>Gerador de Escalas Musicais</h1>
    <p>Escolha a tônica e o tipo de escala que deseja gerar.</p>

    <form id="formulario">
        <label for="tonica">
            Tônica
            <select id="tonica" name="tonica">
                <option>C</option>
                <option>C#</option>
                <option>Cb</option>
                <option>D</option>
                <option>D#</option>
                <option>Db</option>
                <option>E</option>
                <option>E#</option>
                <option>Eb</option>
                <option>F</option>
                <option>F#</option>
                <option>Fb</option>
                <option>G</option>
                <option>G#</option>
                <option>Gb</option>
                <option>A</option>
                <option>A#</option>
                <option>Ab</option>
                <option>B</option>
                <option>B#</option>
                <option>Bb</option>
            </select>
        </label>
        <label for="tipo-escala">
            Escala
            <select id="tipo-escala" name="tipoEscala">
                <option value="maior" selected>Maior</option>
            </select>
        </label>
        <button type="submit">Gerar escala</button>
    </form>

    <div id="resultado" role="status" aria-live="polite"></div>

    <fieldset class="configuracoes-som">
        <legend>Som</legend>
        <div class="opcoes-som">
            <label for="timbre">
                Timbre
                <select id="timbre" name="timbre">
                    <option value="piano">Piano</option>
                    <option value="violino">Violino</option>
                </select>
            </label>
            <label class="controle-volume" for="volume">
                Volume
                <input
                    id="volume"
                    type="range"
                    min="0"
                    max="100"
                    value="70"
                    step="1"
                >
                <output id="valor-volume" for="volume">70%</output>
            </label>
        </div>
    </fieldset>

    <div class="controles-audio" aria-label="Controles de reprodução">
        <button id="ouvir" type="button" disabled>Ouvir escala</button>
        <button id="parar" type="button" disabled>Parar</button>
    </div>
</main>

<script>
    class ReprodutorMusical {
        #contexto;
        #ganhoMestre;
        #volume = 0.7;
        #fontesAtivas = [];

        async iniciarContexto() {
            if (!this.#contexto) {
                this.#contexto = new AudioContext();
                this.#ganhoMestre = this.#contexto.createGain();
                this.#ganhoMestre.gain.value = this.#volume;
                this.#ganhoMestre.connect(this.#contexto.destination);
            }

            if (this.#contexto.state === 'suspended') {
                await this.#contexto.resume();
            }
        }

        definirVolume(volume) {
            this.#volume = Math.min(1, Math.max(0, volume));

            if (this.#ganhoMestre) {
                this.#ganhoMestre.gain.setTargetAtTime(
                    this.#volume,
                    this.#contexto.currentTime,
                    0.01
                );
            }
        }

        async reproduzirSequencia(notas, timbre, duracaoNota = 0.65) {
            await this.iniciarContexto();
            this.parar();

            const inicio = this.#contexto.currentTime;

            notas.forEach((nota, indice) => {
                const instante = inicio + indice * duracaoNota;
                this.#agendarNota(nota.frequencia, instante, duracaoNota * 0.92, timbre);
            });

            return notas.length * duracaoNota;
        }

        async reproduzirSimultaneamente(notas, duracao = 1.5) {
            await this.iniciarContexto();
            this.parar();

            const inicio = this.#contexto.currentTime;

            notas.forEach((nota) => {
                this.#agendarNota(nota.frequencia, inicio, duracao);
            });

            return duracao;
        }

        parar() {
            this.#fontesAtivas.forEach((fonte) => {
                try {
                    fonte.stop();
                } catch {
                    // A fonte pode já ter terminado.
                }
            });

            this.#fontesAtivas = [];
        }

        #agendarNota(frequencia, inicio, duracao, timbre = 'piano') {
            if (timbre === 'violino') {
                this.#agendarViolino(frequencia, inicio, duracao);
                return;
            }

            this.#agendarPiano(frequencia, inicio, duracao);
        }

        #agendarPiano(frequencia, inicio, duracao) {
            // Vários parciais e decaimentos diferentes aproximam a riqueza de uma corda percutida.
            const harmonicos = [
                { multiplo: 1, ganho: 0.22, decaimento: 1 },
                { multiplo: 2.01, ganho: 0.10, decaimento: 0.72 },
                { multiplo: 3.03, ganho: 0.055, decaimento: 0.48 },
                { multiplo: 4.08, ganho: 0.025, decaimento: 0.34 }
            ];

            harmonicos.forEach(({ multiplo, ganho, decaimento }) => {
                const oscilador = this.#contexto.createOscillator();
                const envelope = this.#contexto.createGain();
                const fim = inicio + duracao;

                oscilador.type = 'sine';
                oscilador.frequency.setValueAtTime(frequencia * multiplo, inicio);
                envelope.gain.setValueAtTime(0.0001, inicio);
                envelope.gain.exponentialRampToValueAtTime(ganho, inicio + 0.008);
                envelope.gain.exponentialRampToValueAtTime(
                    Math.max(0.0001, ganho * 0.12),
                    inicio + duracao * decaimento
                );
                envelope.gain.exponentialRampToValueAtTime(0.0001, fim);

                oscilador.connect(envelope);
                envelope.connect(this.#ganhoMestre);
                this.#iniciarFonte(oscilador, envelope, inicio, fim);
            });
        }

        #agendarViolino(frequencia, inicio, duracao) {
            const oscilador = this.#contexto.createOscillator();
            const vibrato = this.#contexto.createOscillator();
            const intensidadeVibrato = this.#contexto.createGain();
            const envelope = this.#contexto.createGain();
            const fim = inicio + duracao;

            oscilador.type = 'sawtooth';
            oscilador.frequency.setValueAtTime(frequencia, inicio);
            vibrato.frequency.setValueAtTime(5.4, inicio);
            intensidadeVibrato.gain.setValueAtTime(0, inicio);
            intensidadeVibrato.gain.linearRampToValueAtTime(frequencia * 0.006, inicio + 0.18);
            envelope.gain.setValueAtTime(0.0001, inicio);
            envelope.gain.linearRampToValueAtTime(0.075, inicio + 0.09);
            envelope.gain.setValueAtTime(0.075, Math.max(inicio + 0.09, fim - 0.1));
            envelope.gain.exponentialRampToValueAtTime(0.0001, fim);

            vibrato.connect(intensidadeVibrato);
            intensidadeVibrato.connect(oscilador.frequency);
            oscilador.connect(envelope);
            envelope.connect(this.#ganhoMestre);

            this.#iniciarFonte(oscilador, envelope, inicio, fim);
            this.#iniciarFonte(vibrato, intensidadeVibrato, inicio, fim);
        }

        #iniciarFonte(fonte, noSaida, inicio, fim) {
            fonte.addEventListener('ended', () => {
                fonte.disconnect();
                noSaida.disconnect();
                this.#fontesAtivas = this.#fontesAtivas.filter(
                    (fonteAtiva) => fonteAtiva !== fonte
                );
            });

            this.#fontesAtivas.push(fonte);
            fonte.start(inicio);
            fonte.stop(fim);
        }

    }

    const formulario = document.querySelector('#formulario');
    const tonica = document.querySelector('#tonica');
    const tipoEscala = document.querySelector('#tipo-escala');
    const resultado = document.querySelector('#resultado');
    const seletorTimbre = document.querySelector('#timbre');
    const botaoOuvir = document.querySelector('#ouvir');
    const botaoParar = document.querySelector('#parar');
    const controleVolume = document.querySelector('#volume');
    const valorVolume = document.querySelector('#valor-volume');
    const reprodutor = new ReprodutorMusical();

    let notasAtuais = [];
    let temporizadorReproducao;

    async function carregarTiposDeEscala() {
        try {
            const resposta = await fetch('/api/escalas/tipos');
            if (!resposta.ok) {
                return;
            }

            const tipos = await resposta.json();
            tipoEscala.replaceChildren(...tipos.map((tipo) => {
                const opcao = document.createElement('option');
                opcao.value = tipo.id;
                opcao.textContent = tipo.nome;
                return opcao;
            }));
        } catch {
            // A opção maior permanece disponível como fallback.
        }
    }

    carregarTiposDeEscala();

    controleVolume.addEventListener('input', () => {
        const percentual = Number(controleVolume.value);
        valorVolume.value = `${percentual}%`;
        reprodutor.definirVolume(percentual / 100);
    });

    formulario.addEventListener('submit', async (evento) => {
        evento.preventDefault();
        reprodutor.parar();
        clearTimeout(temporizadorReproducao);

        notasAtuais = [];
        botaoOuvir.disabled = true;
        botaoOuvir.textContent = 'Ouvir escala';
        botaoParar.disabled = true;
        resultado.classList.remove('erro');
        resultado.textContent = 'Gerando…';

        try {
            const parametros = new URLSearchParams({ tonica: tonica.value });
            const resposta = await fetch(
                `/api/escalas/${tipoEscala.value}?${parametros}`
            );

            if (!resposta.ok) {
                throw new Error('Não foi possível gerar a escala.');
            }

            const escala = await resposta.json();
            notasAtuais = escala.notas;
            resultado.textContent = notasAtuais
                .map((nota) => nota.nome)
                .join(' - ');
            botaoOuvir.disabled = false;
        } catch (erro) {
            resultado.classList.add('erro');
            resultado.textContent = erro.message;
        }
    });

    botaoOuvir.addEventListener('click', async () => {
        if (notasAtuais.length === 0) {
            return;
        }

        clearTimeout(temporizadorReproducao);
        botaoOuvir.disabled = true;
        botaoOuvir.textContent = 'Tocando…';
        botaoParar.disabled = false;

        try {
            const duracao = await reprodutor.reproduzirSequencia(
                notasAtuais,
                seletorTimbre.value
            );

            temporizadorReproducao = setTimeout(() => {
                botaoOuvir.disabled = false;
                botaoOuvir.textContent = 'Ouvir novamente';
                botaoParar.disabled = true;
            }, duracao * 1000);
        } catch {
            botaoOuvir.disabled = false;
            botaoOuvir.textContent = 'Ouvir escala';
            botaoParar.disabled = true;
            resultado.classList.add('erro');
            resultado.textContent = 'Não foi possível reproduzir a escala.';
        }
    });

    botaoParar.addEventListener('click', () => {
        clearTimeout(temporizadorReproducao);
        reprodutor.parar();
        botaoOuvir.disabled = false;
        botaoOuvir.textContent = 'Ouvir novamente';
        botaoParar.disabled = true;
    });
</script>
</body>
</html>
